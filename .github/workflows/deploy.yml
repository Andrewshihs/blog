name: Deploy to EdgeOne Makers

on:
  push:
    branches: [main]
  workflow_dispatch:      # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true          # 拉取 PaperMod 主题
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Deploy to EdgeOne Makers
        run: |
          npx edgeone@latest makers deploy ./public \
            -n blog \
            -t "${{ secrets.EDGEONE_API_TOKEN }}" \
            -e production \
            -a global \
            --json